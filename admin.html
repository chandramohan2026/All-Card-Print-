</script><script>
/* =====================================================================
   SUBSCRIPTION SYSTEM  (localhost / front-end only, no backend)
   Data store: IndexedDB 'AllPrintAdminDB' -> key 'subs'
   NOTE: Sab data SB.get()/SB.put() se hi aata-jaata hai. Jab backend
   banega to sirf in 2 functions ko API call se badalna hoga.
   ===================================================================== */
const SB={tabs:['sbr','sbu','sbm','sbp','sbs'],rf:'pending',uf:'all',uq:''};
SB.DEF_TERMS='1. Subscription sirf registered mobile number ke liye hai.\n2. Ek ID ek hi device par chalegi.\n3. Payment verify hone ke baad hi ID active hogi.\n4. Plan ki fees refund nahi hogi (technical problem ko chhodkar).\n5. Support ke liye admin ko WhatsApp karein.';
SB.norm=d=>{d=d&&typeof d==='object'?d:{};
 const s=Object.assign({biz:'All Print',wa:'',contact:'',defMax:1,mode:'lock',warn:5,terms:SB.DEF_TERMS,seq:1000},d.settings||{});
 const seed=[{id:'p'+Date.now().toString(36),name:s.biz,price:99,days:20,desc:'',upi:'',qr:null,active:true,kind:'new'}];
 return{v:1,seeded:true,settings:s,plans:(Array.isArray(d.plans)?d.plans:(d.seeded?[]:seed)).map(p=>{p.kind=p.kind||'new';return p}),requests:Array.isArray(d.requests)?d.requests:[],msgs:Array.isArray(d.msgs)?d.msgs:[],users:(Array.isArray(d.users)?d.users:[]).map(u=>{if(!Array.isArray(u.devs))u.devs=u.dev?[{id:u.dev,info:u.devInfo||'',tok:u.tok||null,last:u.last||0}]:[];return u})}};
SB.lim=(u,d)=>u.maxDev||d.settings.defMax||1;
SB.get=async()=>{const raw=await admGet('subs'),d=SB.norm(raw);if(!raw||!raw.seeded)await SB.put(d);return d};
SB.put=d=>admSet('subs',d);
SB.tx=async fn=>{const d=await SB.get();const r=await fn(d);await SB.put(d);return r};

/* ---------- helpers ---------- */
SB.fmtD=t=>t?new Date(t).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'—';
SB.fmtDT=t=>t?new Date(t).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'—';
SB.eod=t=>{const d=new Date(t);d.setHours(23,59,59,999);return d.getTime()};
SB.addDays=(t,n)=>{const d=new Date(t);d.setDate(d.getDate()+n);return SB.eod(d.getTime())};
SB.sod=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
SB.left=t=>Math.round((SB.sod(t)-SB.sod(Date.now()))/864e5);
SB.ymd=t=>{const d=new Date(t),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())};
SB.hash=(uid,p)=>admSha256('apuser:'+uid+':'+p);
SB.plabel=p=>p.name+' - '+p.days+' Days (₹'+p.price+')';
SB.ustat=u=>u.blocked?'blocked':(u.expiry<Date.now()?'expired':'active');
SB.rid=()=>'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
SB.devId=()=>{let v=null;try{v=localStorage.getItem('ap_device_id')}catch(e){}
 if(!v){v=SB._mem||('D'+Date.now().toString(36)+Math.random().toString(36).slice(2,8));SB._mem=v;try{localStorage.setItem('ap_device_id',v)}catch(e){}}return v};
SB.devInfo=()=>{const u=navigator.userAgent;
 const b=/Edg\//.test(u)?'Edge':/OPR\//.test(u)?'Opera':/Chrome\//.test(u)?'Chrome':/Firefox\//.test(u)?'Firefox':/Safari\//.test(u)?'Safari':'Browser';
 const o=/Android/.test(u)?'Android':/iPhone|iPad/.test(u)?'iOS':/Windows/.test(u)?'Windows':/Mac OS/.test(u)?'Mac':/Linux/.test(u)?'Linux':'OS';return b+' / '+o};
SB.log=(u,ev)=>{u.log=u.log||[];u.log.unshift({t:Date.now(),e:ev});u.log=u.log.slice(0,25)};
SB.img=(file,maxW,type)=>new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();
 im.onload=()=>{URL.revokeObjectURL(u);const s=Math.min(1,maxW/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
  res(type==='png'?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.82))};
 im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('Image open nahi hui'))};im.src=u});
SB.waLink=(mobile,msg)=>{let m=String(mobile||'').replace(/\D/g,'');if(m.length===10)m='91'+m;return 'https://wa.me/'+m+'?text='+encodeURIComponent(msg)};
SB.copy=async t=>{try{await navigator.clipboard.writeText(t);return true}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(x){}a.remove();return ok}};

/* ---------- Access control: kaun sa user kaun sa section chala sakta hai ---------- */
SB.SECS=[{k:'aadhaar',n:'🪪 Aadhaar Services'},{k:'pan',n:'▤ PAN Card Services',sub:[{k:'pan_uti',n:'UTI PAN'},{k:'pan_nsdl',n:'NSDL PAN'},{k:'pan_manual',n:'Manual PAN'}]},{k:'voter',n:'🗳️ Voter ID Services'},{k:'apaar',n:'🎓 APAAR ID Services'},{k:'ayushman',n:'🌿 Ayushman Card'},{k:'ippb',n:'🏦 IPPB Passbook'},{k:'ippb-atm',n:'💳 IPPB ATM Card'},{k:'print-manager',n:'🖨️ Print Manager'},{k:'abha',n:'ABHA Card (jald aayega)'},{k:'eshram',n:'E-Shram & Labour Card (jald aayega)'},{k:'dl',n:'Driving Licence & RC (jald aayega)'},{k:'farmer',n:'Farmer / Kisan Services (jald aayega)'}];
SB.ALLK=SB.SECS.flatMap(x=>[x.k].concat((x.sub||[]).map(y=>y.k)));
SB.perms=(u,d)=>Array.isArray(u.perms)?u.perms:(Array.isArray(d.settings.defPerms)?d.settings.defPerms:SB.ALLK);
SB.permBoxes=sel=>SB.SECS.map(x=>'<label class="sbPm"><input type="checkbox" class="sbPerm" value="'+x.k+'" '+(sel.includes(x.k)?'checked':'')+'> '+x.n+'</label>'+(x.sub?'<div class="sbPmSub">'+x.sub.map(y=>'<label class="sbPm"><input type="checkbox" class="sbPerm" value="'+y.k+'" '+(sel.includes(y.k)?'checked':'')+'> '+y.n+'</label>').join('')+'</div>':'')).join('');
SB.permCount=(u,d)=>SB.perms(u,d).filter(k=>SB.SECS.some(x=>x.k===k)).length+'/'+SB.SECS.length;

/* ---------- auth / registration (gate bhi yahi use karta hai) ---------- */
SB.sess=()=>{try{return JSON.parse(localStorage.getItem('ap_session')||'null')}catch(e){return null}};
SB.clearSess=()=>{try{localStorage.removeItem('ap_session')}catch(e){}};
SB.login=async(mobile,pass)=>{mobile=String(mobile||'').trim();let out=null;
 await SB.tx(async d=>{const u=d.users.find(x=>x.uid===mobile);
  if(!u||u.ph!==SB.hash(u.uid,pass)){out={err:'Mobile number ya password galat hai.'};return}
  if(u.blocked){out={err:'Aapki ID block hai. Admin se sampark karein.'};return}
  if(u.expiry<Date.now()){out={expired:true,u:{name:u.name,mobile:u.mobile,email:u.email,expiry:u.expiry}};return}
  const dev=SB.devId(),lim=SB.lim(u,d);let ex=u.devs.find(x=>x.id===dev);
  if(!ex){if(u.devs.length>=lim){
    if(d.settings.mode==='lock'){SB.log(u,'Blocked: device limit poori, naya device try ('+SB.devInfo()+')');out={err:'Is ID ki device limit ('+lim+') poori ho chuki hai — ye ID '+lim+' device par hi chal sakti hai. Naya device chalana ho to admin se sampark karein.'};return}
    u.devs.sort((a,b)=>(a.last||0)-(b.last||0));while(u.devs.length>=lim){const r=u.devs.shift();SB.log(u,'Purana device logout: '+(r.info||''))}}
   ex={id:dev};u.devs.push(ex)}
  ex.info=SB.devInfo();ex.tok=SB.rid();ex.last=Date.now();u.last=Date.now();u.logins=(u.logins||0)+1;SB.log(u,'Login: '+SB.devInfo());
  try{localStorage.setItem('ap_session',JSON.stringify({uid:u.uid,tok:ex.tok}))}catch(e){ex.tok=null;out={err:'Browser storage band hai, login nahi ho sakta.'};return}
  out={ok:true,u}});
 return out};
SB.check=async()=>{const s=SB.sess();if(!s)return{ok:false};const d=await SB.get();const u=d.users.find(x=>x.uid===s.uid);
 if(!u)return{ok:false,msg:'Aapki ID admin ne hata di hai.'};
 if(u.blocked)return{ok:false,msg:'Aapki ID block kar di gayi hai. Admin se sampark karein.'};
 if(u.expiry<Date.now())return{ok:false,expired:true,u,msg:'Aapka plan '+SB.fmtD(u.expiry)+' ko expire ho gaya hai.'};
 const me=u.devs.find(x=>x.id===SB.devId());if(!me||me.tok!==s.tok)return{ok:false,msg:'Is device se aap logout ho chuke hain (naye device par login hua ya admin ne logout kiya). Dobara login karein.'};
 return{ok:true,u,d}};
SB.verify=async(mobile,pass)=>{const d=await SB.get(),u=d.users.find(x=>x.uid===String(mobile||'').trim());return u&&u.ph===SB.hash(u.uid,pass)?u:null};
SB.pending=async mobile=>{const d=await SB.get();return d.requests.find(r=>r.mobile===mobile&&r.status==='pending')||null};
SB.register=async f=>{let out;const kind=f.kind==='renew'?'renew':'new';
 await SB.tx(async d=>{const p=d.plans.find(x=>x.id===f.plan&&x.active&&x.kind===kind);
  if(!p){out={err:'Ye plan ab available nahi hai. Dobara plan chunein.'};return}
  const eu=d.users.find(u=>u.uid===f.mobile);
  if(kind==='new'&&eu){out={err:'Is mobile number par account pehle se hai. Plan badhane ke liye "Renewal" use karein.'};return}
  if(kind==='renew'){if(!eu||eu.ph!==SB.hash(eu.uid,f.pass||'')){out={err:'User ID ya password galat hai.'};return}if(eu.blocked){out={err:'Aapki ID block hai. Admin se sampark karein.'};return}}
  const pr=d.requests.find(r=>r.mobile===f.mobile&&r.status==='pending');
  if(pr){out={err:'Is mobile number par request '+pr.id+' pehle se pending hai. Admin ke approve karne ka intezar karein.'};return}
  if(f.utr&&d.requests.some(r=>r.utr&&r.utr.toLowerCase()===f.utr.toLowerCase()&&r.status!=='rejected')){out={err:'Ye UTR / Transaction ID pehle use ho chuka hai.'};return}
  const r={id:'R'+(++d.settings.seq),type:kind,name:kind==='renew'?eu.name:f.name,mobile:f.mobile,email:kind==='renew'?(eu.email||''):f.email,planId:p.id,planName:p.name,days:p.days,price:p.price,utr:f.utr||'',shot:f.shot||null,status:'pending',at:Date.now()};
  if(kind==='renew'){r.prevExpiry=eu.expiry;r.prevPlan=eu.planName||''}
  d.requests.unshift(r);out={ok:true,r}});
 return out};
SB.approve=async id=>{let res;
 await SB.tx(async d=>{const r=d.requests.find(x=>x.id===id);if(!r||r.status!=='pending')throw new Error('Ye request ab pending nahi hai');
  let u=d.users.find(x=>x.uid===r.mobile),isNew=false;
  if(!u&&r.type==='renew')throw new Error('Ye user ab maujood nahi hai (delete ho gaya?)');
  if(!u){isNew=true;u={uid:r.mobile,ph:SB.hash(r.mobile,r.mobile),name:r.name,email:r.email,mobile:r.mobile,created:Date.now(),expiry:0,blocked:false,devs:[],logins:0,log:[]};d.users.push(u)}
  u.expiry=SB.addDays(Math.max(u.expiry||0,Date.now()),r.days);u.planName=r.planName;u.price=r.price;
  SB.log(u,(isNew?'Account bana':'Renew hua')+' ('+r.id+', +'+r.days+' din)');
  r.status='approved';r.done=Date.now();res={u:JSON.parse(JSON.stringify(u)),r,isNew,biz:d.settings.biz}});
 return res};

/* ---------- admin UI helpers ---------- */
SB.modal=html=>{SB.closeModal();const o=document.createElement('div');o.id='sbModal';o.className='sbModal';
 o.innerHTML='<div class="sbBox"><button type="button" class="sbX" data-sb="mclose">✕</button>'+html+'</div>';
 o.addEventListener('click',e=>{if(e.target===o){SB.closeModal();return}const b=e.target.closest('[data-sb]');if(b)SB.act(b)});

  (list.length?list.map(card).join(''):'<div class="admCard"><p class="admHint">Koi message nahi.</p></div>');SB.subsBadge()}

/* ---------- action dispatcher ---------- */
SB.act=async b=>{const a=b.dataset.sb,id=b.dataset.id;
 try{switch(a){
  case 'mclose':SB.closeModal();break;
  case 'rf':SB.rf=b.dataset.v;subsReqTab();break;
  case 'uf':SB.uf=b.dataset.v;subsUsersTab();break;
  case 'rshot':{const d=await SB.get(),r=d.requests.find(x=>x.id===id);if(r&&r.shot)SB.modal('<h3>Payment screenshot — '+r.id+'</h3><img src="'+r.shot+'" style="width:100%;border-radius:10px" alt="">');break}
  case 'rapp':{const d=await SB.get(),r=d.requests.find(x=>x.id===id);if(!r)return;
   if(!confirm(r.name+' ('+r.mobile+')\n'+r.planName+' • ₹'+r.price+' • '+r.days+' din\nUTR: '+(r.utr||'—')+'\n\nPayment mil gaya? Approve karein?'))return;
   const x=await SB.approve(id);await subsReqTab();
   const msg=x.isNew?('Namaste '+x.u.name+', aapka '+x.biz+' account active ho gaya hai.\n\nUser ID: '+x.u.uid+'\nPassword: '+x.u.uid+' (mobile number)\nPlan: '+x.r.planName+' - '+x.r.days+' Days\nExpiry: '+SB.fmtD(x.u.expiry)+'\n\nNote: Ek ID sirf ek device par chalegi.'):('Namaste '+x.u.name+', aapka '+x.biz+' plan renew ho gaya hai.\n\nPlan: '+x.r.planName+' - '+x.r.days+' Days\nNayi Expiry: '+SB.fmtD(x.u.expiry));
   SB._wa=SB.waLink(x.u.mobile,msg);SB._msg=msg;
   SB.modal('<h3>✅ Approved</h3><p class="admHint">'+(x.isNew?'Naya account ban gaya. User ID aur password dono: <b>'+pmEsc(x.u.uid)+'</b> (password baad me Users tab se badal sakte hain).':'Plan renew ho gaya.')+'<br>Nayi expiry: <b>'+SB.fmtD(x.u.expiry)+'</b></p><pre class="sbPre">'+pmEsc(msg)+'</pre><div class="admRow"><button type="button" class="admBtn go" data-sb="wasend">💬 WhatsApp se bhejein</button><button type="button" class="admBtn" data-sb="msgcopy">📋 Copy</button></div>');break}
  case 'wasend':window.open(SB._wa,'_blank');break;
  case 'msgcopy':admToast(await SB.copy(SB._msg)?'✓ Copy ho gaya':'Copy nahi hua',0);break;
  case 'rrej':{const n=prompt('Reject karne ka reason (optional):');if(n===null)return;await SB.tx(async d=>{const r=d.requests.find(x=>x.id===id);if(r&&r.status==='pending'){r.status='rejected';r.note=n.trim();r.done=Date.now()}});admToast('Request reject ho gayi');subsReqTab();break}
  case 'rdel':if(!confirm('Ye request delete karein?'))return;await SB.tx(async d=>{d.requests=d.requests.filter(x=>x.id!==id)});subsReqTab();break;
  /* users */
  case 'uman':SB.openUser(id);break;
  case 'uadd':{const d=await SB.get();if(!d.plans.length){admToast('Pehle Plans tab me plan banayein',1);return}
   const PL=d.plans.filter(p=>p.kind==='new');if(!PL.length){admToast('Pehle ek Registration plan banayein',1);return}
   SB.modal('<h3>➕ Naya User</h3><p class="admHint">Cash / direct payment wale user ko yahin se jodein. ID aur password dono mobile number honge.</p><label>Full Name</label><input type="text" id="nName"><label>Mobile (10 digit)</label><input type="text" id="nMob" inputmode="numeric" maxlength="10"><label>Email (optional)</label><input type="text" id="nMail"><label>Plan</label><select id="nPlan">'+PL.map(p=>'<option value="'+p.id+'">'+pmEsc(SB.plabel(p))+'</option>').join('')+'</select><div class="admRow"><button type="button" class="admBtn go" data-sb="uaddsave">💾 User banayein</button></div>');break}
  case 'uaddsave':{const n=SB.v('nName'),m=SB.v('nMob'),e=SB.v('nMail'),pid=SB.v('nPlan');
   if(n.length<2)return admToast('Naam likhein',1);if(!/^[6-9]\d{9}$/.test(m))return admToast('Sahi 10 digit mobile number daalein',1);
   await SB.tx(async d=>{if(d.users.some(u=>u.uid===m))throw new Error('Ye mobile pehle se registered hai');const p=d.plans.find(x=>x.id===pid);
    const u={uid:m,ph:SB.hash(m,m),name:n,email:e,mobile:m,created:Date.now(),expiry:SB.addDays(Date.now(),p.days),planName:p.name,price:p.price,blocked:false,devs:[],logins:0,log:[]};SB.log(u,'Admin ne manually banaya (+'+p.days+' din)');d.users.push(u)});
   SB.closeModal();admToast('✓ User ban gaya');subsUsersTab();break}
  case 'ext':await SB.mutUser(id,u=>{const n=+b.dataset.n;u.expiry=SB.addDays(n>0?Math.max(u.expiry,Date.now()):u.expiry,n);SB.log(u,'Expiry '+(n>0?'+':'')+n+' din → '+SB.fmtD(u.expiry))},'✓ Expiry badal gayi');break;
  case 'extc':{const n=parseInt(SB.v('mCustom'),10);if(!n)return admToast('Din likhein (jaise 10 ya -5)',1);
   await SB.mutUser(id,u=>{u.expiry=SB.addDays(n>0?Math.max(u.expiry,Date.now()):u.expiry,n);SB.log(u,'Expiry '+(n>0?'+':'')+n+' din → '+SB.fmtD(u.expiry))},'✓ Expiry badal gayi');break}
  case 'exset':{const v=SB.v('mDate');if(!v)return admToast('Date chunein',1);const p=v.split('-').map(Number);
   await SB.mutUser(id,u=>{u.expiry=SB.eod(new Date(p[0],p[1]-1,p[2]).getTime());SB.log(u,'Expiry set → '+SB.fmtD(u.expiry))},'✓ Expiry set ho gayi');break}
  case 'pwset':{const v=SB.v('mPw');if(v.length<4)return admToast('Password kam se kam 4 ka rakhein',1);
   await SB.mutUser(id,u=>{u.ph=SB.hash(u.uid,v);u.devs.forEach(x=>x.tok=null);SB.log(u,'Password badla (user logout)')},'✓ Password badal gaya — user ko dobara login karna hoga');break}
  case 'pwmob':await SB.mutUser(id,u=>{u.ph=SB.hash(u.uid,u.uid);u.devs.forEach(x=>x.tok=null);SB.log(u,'Password = mobile number')},'✓ Password ab mobile number hai');break;
  case 'pmall':case 'pmnone':document.querySelectorAll('#sbModal .sbPerm').forEach(i=>i.checked=(a==='pmall'));break;
  case 'pmdef':{const d=await SB.get(),L=Array.isArray(d.settings.defPerms)?d.settings.defPerms:SB.ALLK;document.querySelectorAll('#sbModal .sbPerm').forEach(i=>i.checked=L.includes(i.value));break}
  case 'pmsave':{const L=[...document.querySelectorAll('#sbModal .sbPerm:checked')].map(i=>i.value);await SB.mutUser(id,u=>{u.perms=L;SB.log(u,'Access badla: '+L.filter(k=>SB.SECS.some(x=>x.k===k)).length+' section')},'✓ Access save ho gaya');break}
  case 'dpsave':{const L=[...document.querySelectorAll('#sbDefPerm .sbPerm:checked')].map(i=>i.value);await SB.tx(async d=>{d.settings.defPerms=L});admToast('✓ Default access save ho gaya');break}
  case 'maxd':await SB.mutUser(id,u=>{u.maxDev=+b.dataset.n;if(u.devs.length>u.maxDev){u.devs.sort((a,c)=>(c.last||0)-(a.last||0));u.devs=u.devs.slice(0,u.maxDev)}SB.log(u,'Device limit = '+u.maxDev)},'✓ Device limit set ho gayi');break;
  case 'devdel':await SB.mutUser(id,u=>{u.devs=u.devs.filter(x=>x.id!==b.dataset.v);SB.log(u,'Admin ne ek device hataya')},'✓ Device hata diya');break;
  case 'devrst':if(!confirm('Device reset karein? User naye device se login kar payega (purana device logout ho jayega).'))return;
   await SB.mutUser(id,u=>{u.devs=[];SB.log(u,'Admin ne sab device reset kiye')},'✓ Device reset ho gaya');break;
  case 'lout':await SB.mutUser(id,u=>{u.devs.forEach(x=>x.tok=null);SB.log(u,'Admin ne force logout kiya')},'✓ User logout ho gaya');break;
  case 'uinfo':{const n=SB.v('mName');if(n.length<2)return admToast('Naam likhein',1);await SB.mutUser(id,u=>{u.name=n;u.email=SB.v('mMail')},'✓ Save ho gaya');break}
  case 'blk':await SB.mutUser(id,u=>{u.blocked=!u.blocked;if(u.blocked)u.devs.forEach(x=>x.tok=null);SB.log(u,u.blocked?'Admin ne block kiya':'Admin ne unblock kiya')},'✓ Update ho gaya');break;
  case 'udel':if(!confirm('User permanently delete karein?'))return;await SB.tx(async d=>{d.users=d.users.filter(x=>x.uid!==id)});SB.closeModal();admToast('User delete ho gaya');admRender();break;
  case 'csv':{const d=await SB.get(),q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"',rows=[['User ID','Name','Email','Plan','Expiry','Status','Device','Last login'].map(q).join(',')];
   d.users.forEach(u=>rows.push([u.uid,u.name,u.email,u.planName,SB.fmtD(u.expiry),SB.ustat(u),u.devs.map(x=>x.info).join(' + '),SB.fmtDT(u.last)].map(q).join(',')));pmSave(new Blob(['\ufeff'+rows.join('\n')],{type:'text/csv'}),'users.csv');break}
  /* plans */
  case 'padd':SB.planForm('',b.dataset.k);break;
  case 'pedit':SB.planForm(id);break;
  case 'psave':{const n=SB.v('pName'),pr=parseInt(SB.v('pPrice'),10),dy=parseInt(SB.v('pDays'),10);
   if(!n)return admToast('Plan ka naam likhein',1);if(!(pr>0))return admToast('Sahi price daalein',1);if(!(dy>0))return admToast('Sahi din daalein',1);
   await SB.tx(async d=>{let p=d.plans.find(x=>x.id===id);if(!p){p={id:'p'+SB.rid(),qr:null,kind:b.dataset.k==='renew'?'renew':'new'};d.plans.push(p)}
    Object.assign(p,{name:n,price:pr,days:dy,desc:SB.v('pDesc'),upi:SB.v('pUpi'),active:document.getElementById('pAct').checked});if(SB._pqr!==undefined)p.qr=SB._pqr});
   SB._pqr=undefined;SB.closeModal();admToast('✓ Plan save ho gaya');subsPlansTab();break}
  case 'pqrdel':SB._pqr=null;document.getElementById('pQrPrev').innerHTML='<span>QR nahi (Save dabayein)</span>';break;
  case 'ptog':await SB.tx(async d=>{const p=d.plans.find(x=>x.id===id);if(p)p.active=!p.active});subsPlansTab();break;
  case 'pdel':if(!confirm('Plan delete karein? (Purani requests / users par asar nahi padega)'))return;await SB.tx(async d=>{d.plans=d.plans.filter(x=>x.id!==id)});subsPlansTab();break;
  case 'mf':SB.mf=b.dataset.v;subsMsgTab();break;
  case 'mdone':await SB.tx(async d=>{const m=d.msgs.find(x=>x.id===id);if(m)m.status='done'});subsMsgTab();break;
  case 'mdel':if(!confirm('Ye message delete karein?'))return;await SB.tx(async d=>{d.msgs=d.msgs.filter(x=>x.id!==id)});subsMsgTab();break;
  case 'mreply':{const d=await SB.get(),m=d.msgs.find(x=>x.id===id);if(!m)return;SB._mid=id;
   SB.modal('<h3>💬 Reply — '+pmEsc(m.name||m.mobile)+'</h3><div class="sbPre">'+pmEsc(m.text)+'</div><label>Aapka jawab</label><textarea id="mRep" rows="4">'+pmEsc(m.reply||'')+'</textarea><p class="admHint">Ye jawab user ko app ke Help &amp; Support me dikhega.</p><div class="admRow"><button type="button" class="admBtn go" data-sb="mrsave">💾 Save reply</button><button type="button" class="admBtn" data-sb="mrwa">💬 Save + WhatsApp</button></div>');break}
  case 'mrsave':case 'mrwa':{const t=document.getElementById('mRep').value.trim();if(!t)return admToast('Jawab likhein',1);let mob='';
   await SB.tx(async d=>{const m=d.msgs.find(x=>x.id===SB._mid);if(m){m.reply=t;m.repAt=Date.now();m.status='done';mob=m.mobile}});SB.closeModal();admToast('✓ Reply save ho gaya');if(a==='mrwa')window.open(SB.waLink(mob,t),'_blank');subsMsgTab();break}
  case 'mpapp':{const d0=await SB.get(),m0=d0.msgs.find(x=>x.id===id);if(!m0||!confirm(m0.name+' ('+m0.mobile+') ka password badal dein?\n(Pehle pehchan confirm kar lein)'))return;
   let mob='';await SB.tx(async d=>{const m=d.msgs.find(x=>x.id===id),u=d.users.find(x=>x.uid===m.mobile);if(!u)throw new Error('User nahi mila');u.ph=m.ph;u.devs.forEach(x=>x.tok=null);SB.log(u,'Password change request approve ('+m.id+')');m.status='approved';m.ph='';mob=u.mobile});
   admToast('✓ Password badal gaya');subsMsgTab();SB.modal('<h3>✅ Password badal diya</h3><p class="admHint">User ko batayein ki ab naye password se login karein.</p><div class="admRow"><button type="button" class="admBtn go" data-sb="wasend">💬 WhatsApp se batayein</button></div>');SB._wa=SB.waLink(mob,'Aapka password change ho gaya hai. Ab naye password se login karein.');break}
  case 'mprej':{const n=prompt('Reject karne ka reason (optional):');if(n===null)return;await SB.tx(async d=>{const m=d.msgs.find(x=>x.id===id);if(m){m.status='rejected';m.note=n.trim();m.ph=''}});subsMsgTab();break}
  /* settings */
  case 'setsave':{const w=parseInt(SB.v('sWarn'),10);await SB.tx(async d=>{Object.assign(d.settings,{biz:SB.v('sBiz')||'All Print',contact:SB.v('sContact').replace(/[^\d+]/g,''),defMax:+SB.v('sDef')||1,wa:SB.v('sWa').replace(/\D/g,''),mode:SB.v('sMode'),warn:w>=0?w:5,terms:A$('sTerms').value.trim()||SB.DEF_TERMS})});admToast('✓ Settings save ho gayi');break}
  case 'exp':{const d=await SB.get();pmSave(new Blob([JSON.stringify(d)],{type:'application/json'}),'subscription-backup.json');break}
  case 'devnew':try{localStorage.setItem('ap_device_id','D'+Date.now().toString(36)+Math.random().toString(36).slice(2,8))}catch(e){}SB._mem=null;admToast('✓ Naya Device ID — ab ye browser "naya device" hai');subsSetTab();break;
  case 'sreset':if(!confirm('Saare users, requests aur plans delete ho jayenge. Pakka?'))return;await SB.put(SB.norm({seeded:false}));SB.clearSess();admToast('✓ Reset ho gaya');subsSetTab();break;
 }}catch(e){admToast('Error: '+(e.message||e),1)}};

A$('admBody').addEventListener('click',e=>{const b=e.target.closest('[data-sb]');if(b)SB.act(b)});
A$('admBody').addEventListener('change',async e=>{const i=e.target;if(i.id!=='sbImp')return;const f=i.files[0];if(!f)return;
 try{const d=JSON.parse(await f.text());if(!d||!Array.isArray(d.users))throw 0;if(!confirm('Current subscription data replace ho jayega. Import karein?'))return;await SB.put(SB.norm(d));admToast('✓ Import ho gaya');subsSetTab()}catch(x){admToast('Backup file sahi nahi hai',1)}});

/* =====================================================================
   ADMIN TAB: ✍️ Manual PAN templates (Front / Back)
   Data: window.apAdminData.manual = [{id,name,side,img,trim}]
   ===================================================================== */
function admMpanTab(){const D=window.apAdminData;D.manual=Array.isArray(D.manual)?D.manual:[];const L=D.manual;
 const row=t=>`<div class="admItem"><div class="admThumbs" style="grid-template-columns:120px 1fr;align-items:center"><div><img src="${t.img}" alt=""></div><div style="display:block;aspect-ratio:auto;background:none"><input type="text" id="mpN_${t.id}" value="${pmEsc(t.name)}"></div></div><div class="admRow"><button type="button" class="admBtn go" data-mp="ren" data-id="${t.id}">Naam save</button><label class="admBtn">Image badlein<input type="file" accept="image/*" hidden data-mp="img" data-id="${t.id}"></label><button type="button" class="admBtn danger" data-mp="del" data-id="${t.id}">🗑 Delete</button></div></div>`;
 const fr=L.filter(t=>t.side==='front'),bk=L.filter(t=>t.side==='back');
 A$('admBody').innerHTML=`<div class="admCard"><h3>✍️ Manual PAN – Templates</h3><p class="admHint">Yahan jo templates jodenge wo PAN Card → <b>MANUAL PAN</b> tool me sabhi users ko dikhenge. Pehla Front aur pehla Back template apne-aap lag jata hai; user dropdown se doosra bhi chun sakta hai (★ nishaan = admin template). Jitne chahein utne add karein.</p>
 <p class="admHint"><b>Template ka size / layout:</b> image <b>1216 × 768</b> (card ke ratio) ki banayein. Tool in jagahon par data likhta hai: Photo (bayein upar), Signature (neeche beech me), QR (daayein), Naam / Pita ka naam / DOB (neeche bayein) aur ID text (beech upar). Safed/khali kinara <i>auto-kaatne</i> ka option neeche hai.</p>
 <label>Template ka naam</label><input type="text" id="mpNewName" placeholder="Jaise: Manual PAN Front"><label>Kis side ke liye</label><select id="mpNewSide"><option value="front">Front (आगे)</option><option value="back">Back (पीछे)</option></select><label>Template image</label><input type="file" id="mpNewImg" accept="image/*"><label style="display:flex;gap:6px;align-items:center;font-weight:400"><input type="checkbox" id="mpNewTrim" checked> Safed/khali kinara apne-aap kaatein</label><div class="admRow"><button type="button" class="go" id="mpAdd">➕ Add karein</button></div></div>
 <div class="admCard"><h3>Front templates (${fr.length})</h3>${fr.map(row).join('')||'<p class="admHint">Abhi koi nahi.</p>'}</div>
 <div class="admCard"><h3>Back templates (${bk.length})</h3>${bk.map(row).join('')||'<p class="admHint">Abhi koi nahi.</p>'}</div>`;
 A$('mpAdd').onclick=async()=>{const n=A$('mpNewName').value.trim(),f=A$('mpNewImg').files[0];if(!n){admToast('Template ka naam likhein',1);return}if(!f){admToast('Image chunein',1);return}
  try{D.manual.push({id:admId(),name:n,side:A$('mpNewSide').value,img:await admScale(f,1600),trim:A$('mpNewTrim').checked});await admSave();admToast('✓ Template add ho gaya: '+n);admMpanTab()}catch(e){admToast('Add nahi hua: '+e.message,1)}}}
async function admMpanAct(el){const D=window.apAdminData,L=D.manual||[],id=el.dataset.id,act=el.dataset.mp;
 try{if(act==='ren'){const v=A$('mpN_'+id).value.trim();if(!v){admToast('Naam khali nahi ho sakta',1);return}L.find(t=>t.id===id).name=v;await admSave();admToast('✓ Naam save ho gaya')}
  else if(act==='del'){const t=L.find(x=>x.id===id);if(!confirm('"'+t.name+'" delete karein?'))return;D.manual=L.filter(x=>x.id!==id);await admSave();admToast('Delete ho gaya');admMpanTab()}
  else if(act==='img'){const f=el.files[0];if(!f)return;L.find(t=>t.id===id).img=await admScale(f,1600);await admSave();admToast('✓ Image badal gayi');admMpanTab()}}catch(e){admToast('Error: '+e.message,1)}}
A$('admBody').addEventListener('click',e=>{const b=e.target.closest('[data-mp]');if(b&&b.tagName!=='INPUT')admMpanAct(b)});
A$('admBody').addEventListener('change',e=>{const b=e.target;if(b.matches&&b.matches('input[data-mp="img"]'))admMpanAct(b)});
